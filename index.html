<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Drawing App</title>
  <Link rel="stylesheet" href="/index.css">
  <style>
    /* RESET */
      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }
      
      /* ROOT VARIABLES */
      :root {
          --bg: #0f172a;
          --card: rgba(255, 255, 255, 0.05);
          --border: rgba(255, 255, 255, 0.1);
          --text: #e5e7eb;
          --text-light: #9ca3af;
          --accent: #3b82f6;
      }
      
      /* BODY */
      body {
          background: linear-gradient(135deg, #0f172a, #1e293b);
          color: var(--text);
          font-family: 'Poppins', sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
      }
      
      /* APP CONTAINER */
      #app {
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
      }
      
      /* TOOLBAR (CENTERED & CLEAN) */
      #toolbar {
          width: 95%;
          max-width: 1400px;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-wrap: wrap;
          gap: 12px;
          padding: 12px 16px;
          border-radius: 15px;
          background: var(--card);
          backdrop-filter: blur(12px);
          border: 1px solid var(--border);
          margin-top: 10px;
      }
      
      /* COLOR DOTS */
      .color-dot {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          cursor: pointer;
          transition: 0.2s;
      }
      
      .color-dot:hover {
          transform: scale(1.15);
      }
      
      .color-dot.active {
          border: 2px solid white;
          transform: scale(1.2);
      }
      
      /* BUTTONS */
      button {
          padding: 6px 14px;
          border-radius: 10px;
          border: 1px solid var(--border);
          background: transparent;
          color: var(--text);
          cursor: pointer;
          transition: 0.2s;
      }
      
      button:hover {
          background: var(--accent);
          color: white;
          border-color: var(--accent);
      }
      
      /* MODE BADGE */
      #mode-badge {
          padding: 5px 12px;
          border-radius: 20px;
          font-size: 12px;
          background: rgba(255, 255, 255, 0.08);
      }
      
      #mode-badge.draw {
          background: #1e40af;
          color: #fff;
      }
      
      #mode-badge.erase {
          background: #7f1d1d;
          color: #fff;
      }
      
      #mode-badge.color {
          background: #5b21b6;
          color: #fff;
      }
      
      /* FULL SCREEN CANVAS AREA */
      #canvas-wrap {
          position: relative;
          width: 100vw;
          /* FULL WIDTH */
          height: 85vh;
          /* LARGE HEIGHT */
          border-top: 1px solid var(--border);
          border-bottom: 1px solid var(--border);
          background: #000;
          overflow: hidden;
      }
      
      /* VIDEO */
      #video {
          position: absolute;
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform: scaleX(-1);
          opacity: 0.9;
      }
      
      /* DRAW CANVAS */
      #draw-canvas {
          position: absolute;
          width: 100%;
          height: 100%;
      }
      
      /* STATUS */
      #status {
          position: absolute;
          top: 10px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 12px;
          padding: 6px 14px;
          border-radius: 20px;
          background: rgba(0, 0, 0, 0.6);
      }
      
      /* CURSOR */
      #cursor {
          position: absolute;
          border-radius: 50%;
          border: 2px solid white;
          pointer-events: none;
      }
      
      /* COLOR RING */
      #color-ring {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
      }
      
      #color-ring-inner {
          display: flex;
          gap: 10px;
          padding: 10px;
          border-radius: 30px;
          background: rgba(0, 0, 0, 0.6);
      }
      
      /* HINT BAR */
      #hint-bar {
          width: 95%;
          max-width: 1200px;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
          margin-bottom: 10px;
      }
      
      .hint {
          font-size: 12px;
          padding: 5px 10px;
          border-radius: 12px;
          background: rgba(255, 255, 255, 0.08);
          color: var(--text-light);
      }
  </style>
</head>

<body>
  <h2 class="sr-only">Air drawing app with fixed 2-finger erase gesture</h2>

  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <div id="colors" style="display:flex; gap:6px; align-items:center;"></div>

      <div class="sep"></div>
      <span id="mode-badge">Idle</span>

      <div style="flex:1;"></div>

      <button onclick="clearCanvas()"
        style="padding:5px 12px; font-size:13px; font-weight:500; border:0.5px solid var(--color-border-secondary); border-radius:var(--border-radius-md); background:transparent; color:var(--color-text-primary); cursor:pointer;">
        Clear
      </button>

      <button onclick="saveDrawing()"
        style="padding:5px 12px; font-size:13px; font-weight:500; border:0.5px solid var(--color-border-secondary); border-radius:var(--border-radius-md); background:transparent; color:var(--color-text-primary); cursor:pointer;">
        Save
      </button>

      <div class="sep"></div>

      <div id="size-wrap">
        Size
        <input type="range" id="size-slider" min="2" max="40" value="8" step="1"
          oninput="brushSize=+this.value; document.getElementById('size-val').textContent=this.value">
        <span id="size-val">8</span>px
      </div>
    </div>

    <!-- Canvas Area -->
    <div id="canvas-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="draw-canvas"></canvas>
      <div id="cursor"></div>

      <div id="color-ring">
        <div id="ring-label">3 fingers — move left/right</div>
        <div id="color-ring-inner"></div>
      </div>

      <div id="status">Starting camera...</div>
    </div>

    <!-- Hint Bar -->
    <div id="hint-bar">
      <span class="hint">1 finger = draw</span>
      <span class="hint">2 fingers = erase</span>
      <span class="hint">3 fingers = change color</span>
      <span class="hint">4+ fingers = lift pen</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
       <script>
    const COLORS = ['#e24b4a', '#ef9f27', '#63C917', '#378add', '#8b5cf6', '#ec4899', '#ffffff'];
    
    let activeColor = COLORS[3];
    let brushSize = 8;
    
    let drawLast = null;
    let eraseLast = null;
    
    let smX = null, smY = null;
    let smEX = null, smEY = null;
    
    let colorPickIndex = 3;
    let colorPickCooldown = 0;
    
    let stableFingers = 0;
    let stableCount = 0;
    
    let currentMode = "idle";
    
    const video = document.getElementById('video');
    const dc = document.getElementById('draw-canvas');
    const ctx = dc.getContext('2d');
    
    const cursor = document.getElementById('cursor');
    const statusEl = document.getElementById('status');
    const modeBadge = document.getElementById('mode-badge');
    const colorRing = document.getElementById('color-ring');
    const ringInner = document.getElementById('color-ring-inner');
    
    function smooth(x, y, alpha = 0.3) {
        if (smX === null) { smX = x; smY = y; return { x, y }; }
        smX += alpha * (x - smX);
        smY += alpha * (y - smY);
        return { x: smX, y: smY };
    }
    
    function smoothErase(x, y, alpha = 0.3) {
        if (smEX === null) { smEX = x; smEY = y; return { x, y }; }
        smEX += alpha * (x - smEX);
        smEY += alpha * (y - smEY);
        return { x: smEX, y: smEY };
    }
    
    function resetSmooth() { smX = smY = null; }
    function resetSmoothErase() { smEX = smEY = null; }
    
    function setMode(mode, label) {
        if (currentMode !== mode) {
            currentMode = mode;
            modeBadge.className = mode;
            modeBadge.textContent = label;
        }
    }
    
    function setStatus(msg) {
        statusEl.textContent = msg;
    }
    
    function showCursor(x, y, size, color) {
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';
        cursor.style.width = size + 'px';
        cursor.style.height = size + 'px';
        cursor.style.background = color;
        cursor.style.display = 'block';
    }
    
    function hideCursor() {
        cursor.style.display = 'none';
    }
    
    function countFingers(lm) {
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];
        let count = 0;
    
        for (let i = 0; i < tips.length; i++) {
            if ((lm[pips[i]].y - lm[tips[i]].y) > 0.02) count++;
        }
        return count;
    }
    
    function lmToCanvas(lm, i) {
        return {
            x: lm[i].x * dc.width,
            y: lm[i].y * dc.height
        };
    }
    
    function resizeCanvas() {
        const wrap = document.getElementById('canvas-wrap');
    
        const temp = document.createElement('canvas');
        temp.width = dc.width;
        temp.height = dc.height;
        temp.getContext('2d').drawImage(dc, 0, 0);
    
        dc.width = wrap.clientWidth;
        dc.height = wrap.clientHeight;
    
        ctx.drawImage(temp, 0, 0, dc.width, dc.height);
    }
    
    window.addEventListener('resize', resizeCanvas);
    
    function clearCanvas() {
        ctx.clearRect(0, 0, dc.width, dc.height);
    }
    
    function saveDrawing() {
        const tmp = document.createElement('canvas');
        tmp.width = dc.width;
        tmp.height = dc.height;
    
        const tctx = tmp.getContext('2d');
        tctx.fillStyle = '#1a1a1a';
        tctx.fillRect(0, 0, tmp.width, tmp.height);
        tctx.drawImage(dc, 0, 0);
    
        const a = document.createElement('a');
        a.href = tmp.toDataURL();
        a.download = 'air-drawing.png';
        a.click();
    }
    
    function onResults(results) {
        if (!results.multiHandLandmarks?.length) {
            resetSmooth();
            resetSmoothErase();
            drawLast = null;
            eraseLast = null;
            hideCursor();
            setMode("idle", "Idle");
            setStatus("Show your hand");
            return;
        }
    
        const lm = results.multiHandLandmarks[0];
        const fingers = countFingers(lm);
    
        // stabilize gesture
        if (fingers === stableFingers) {
            stableCount++;
        } else {
            stableFingers = fingers;
            stableCount = 0;
        }
    
        if (stableCount < 4) return;
    
        if (colorPickCooldown > 0) colorPickCooldown--;
    
        // DRAW
        if (fingers === 1) {
            setMode("draw", "Drawing");
            setStatus("1 finger → draw");
            colorRing.style.display = 'none';
    
            const raw = lmToCanvas(lm, 8);
            const speed = drawLast ? Math.hypot(raw.x - drawLast.x, raw.y - drawLast.y) : 0;
            const alpha = speed > 10 ? 0.5 : 0.25;
            const p = smooth(raw.x, raw.y, alpha);
    
            if (currentMode !== "draw") {
                ctx.globalCompositeOperation = "source-over";
            }
    
            ctx.strokeStyle = activeColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = "round";
    
            if (drawLast) {
                ctx.beginPath();
                ctx.moveTo(drawLast.x, drawLast.y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }
    
            drawLast = p;
            eraseLast = null;
    
            showCursor(raw.x, raw.y, brushSize + 6, activeColor + '88');
        }
    
        // ERASE
        else if (fingers === 2) {
            setMode("erase", "Erasing");
            setStatus("2 fingers → erase");
            colorRing.style.display = 'none';
    
            const t1 = lmToCanvas(lm, 8);
            const t2 = lmToCanvas(lm, 12);
    
            const rawX = (t1.x + t2.x) / 2;
            const rawY = (t1.y + t2.y) / 2;
    
            const p = smoothErase(rawX, rawY, 0.3);
    
            const size = Math.max(brushSize * 5, 40);
    
            ctx.globalCompositeOperation = "destination-out";
            ctx.lineWidth = size;
    
            if (eraseLast) {
                ctx.beginPath();
                ctx.moveTo(eraseLast.x, eraseLast.y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }
    
            eraseLast = p;
            drawLast = null;
    
            showCursor(rawX, rawY, size, "rgba(255,255,255,0.15)");
        }
    
        // COLOR PICK
        else if (fingers === 3) {
            setMode("color", "Pick Color");
            setStatus("Move hand ← →");
            colorRing.style.display = 'flex';
    
            const x = lmToCanvas(lm, 8).x;
            const zone = dc.width / COLORS.length;
            const idx = Math.floor(x / zone);
    
            if (idx !== colorPickIndex && colorPickCooldown === 0) {
                colorPickIndex = idx;
                activeColor = COLORS[idx];
                colorPickCooldown = 8;
            }
    
            showCursor(x, 50, 14, "#fff");
        }
    
        else {
            setMode("idle", "Idle");
            setStatus("Raise fingers to act");
            drawLast = null;
            eraseLast = null;
            resetSmooth();
            resetSmoothErase();
            hideCursor();
        }
    }
    
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return true;
        } catch {
            setStatus("Camera blocked");
            return false;
        }
    }
    
    function initHands() {
        const hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });
    
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
    
        hands.onResults(onResults);
    
        const cam = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480
        });
    
        cam.start();
    }
    
    (async () => {
        const ok = await startCamera();
        if (!ok) return;
    
        video.onloadedmetadata = () => {
            resizeCanvas();
            setTimeout(initHands, 500);
        };
    })();
</script>
</body>

</html>
